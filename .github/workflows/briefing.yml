name: morning-briefing

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 한국시간 오전 7:00 (GitHub 사정으로 수 분~수십 분 늦을 수 있음)
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 실행 기록(SQLite)을 매일 이어서 쌓기 위한 캐시
      - uses: actions/cache@v4
        with:
          path: data
          key: briefing-db-${{ github.run_id }}
          restore-keys: briefing-db-

      - name: Run briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m briefing run
